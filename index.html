<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frostline Snow Services - Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo Display -->
        <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center text-white text-xl font-black shadow-inner">❄️</div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">Frostline</h1>
          <p class="text-xs text-slate-500">Snow Services Edmonton</p>
        </div>
      </div>
      <a href="tel:7800000000" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">Need Help?</a>
    </div>
  </header>

  <!-- Main Booking App Container -->
  <main class="max-w-2xl mx-auto px-4 py-8">

    <!-- STEP 1: EMAIL VERIFICATION -->
    <div id="step1" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="mb-6">
        <span class="text-xs font-bold text-sky-600 uppercase tracking-wider">Step 1 of 9</span>
        <h2 class="text-xl font-bold text-slate-900 mt-1">Verify Your Email Address</h2>
        <p class="text-sm text-slate-500">We’ll send a 6-digit confirmation code to verify your service account.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
          <input type="email" id="emailInput" placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-slate-900">
        </div>

        <button id="btnSendCode" onclick="sendVerificationCode()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-md shadow-sky-100 transition">
          Send Verification Code
        </button>

        <!-- Code Input Box (Hidden initially) -->
        <div id="codeSection" class="hidden space-y-3 pt-2">
          <label class="block text-sm font-semibold text-slate-700">Enter 6-Digit Code</label>
          <div class="flex space-x-2">
            <input type="text" id="codeInput" maxlength="6" placeholder="123456" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-center tracking-widest text-lg font-bold">
            <button onclick="verifyCode()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 rounded-xl transition">
              Verify
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- STEP 2: PROPERTY ADDRESS (Hidden by default) -->
    <div id="step2" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <span class="text-xs font-bold text-sky-600 uppercase tracking-wider">Step 2 of 9</span>
      <h2 class="text-xl font-bold text-slate-900 mt-1">Property Location</h2>
      <p class="text-sm text-slate-500 mb-4">Enter your Edmonton area address.</p>
      
      <input type="text" id="addressInput" placeholder="12345 100 St NW, Edmonton" class="w-full px-4 py-3 rounded-xl border border-slate-300 mb-4">
      <button onclick="alert('Address saved! Proceeding...')" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl">Next Step</button>
    </div>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // --- EMAILJS INTEGRATION ---
    const EMAILJS_PUBLIC_KEY = "1gFDyAi2z11U1cXoO";  // Replace with your Public Key from Miraj -> Account
    const EMAILJS_SERVICE_ID = "service_d73rlh2";   // Your Gmail Service ID
    const EMAILJS_TEMPLATE_ID = "template_l7qdsij"; // Your Template ID

    // Initialize EmailJS
    if (typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }

    let generatedCode = "";

    function sendVerificationCode() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@')) {
        alert('Please enter a valid email address.');
        return;
      }

      // Generate random 6-digit code
      generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

      // Send via EmailJS
      if (typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: email,
          passcode: generatedCode
        }).then(() => {
          alert(`Verification code sent to ${email}! Check your inbox.`);
        }).catch(err => {
          console.error("EmailJS Error:", err);
          alert(`Error sending email. Your verification code is: ${generatedCode}`);
        });
      } else {
        alert(`Demo Mode: Your verification code is: ${generatedCode}`);
      }

      document.getElementById('codeSection').classList.remove('hidden');
      document.getElementById('btnSendCode').classList.add('hidden');
    }

    function verifyCode() {
      const userCode = document.getElementById('codeInput').value.trim();
      if (userCode === generatedCode && generatedCode !== "") {
        alert('Email verified successfully!');
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
      } else {
        alert('Invalid code. Please try again.');
      }
    }
  </script>
</body>
</html>
